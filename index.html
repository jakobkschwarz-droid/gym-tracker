<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Gym Tracker</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--card2:#20242d;--line:#2a2f3a;--txt:#eef0f4;--mut:#8b93a3;--acc:#4ade80;--acc2:#22c55e;--warn:#fbbf24;--bad:#f87171;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,Helvetica,Arial,sans-serif;overscroll-behavior:none}
button{font-family:inherit;touch-action:manipulation}
#app{display:flex;flex-direction:column;height:100%}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 14px) 14px 24px;max-width:640px;width:100%;margin:0 auto}
nav{display:flex;background:#12141a;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:10px 4px 9px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{font-size:21px;line-height:1}
nav button.on{color:var(--acc)}
h1{font-size:26px;margin:4px 0 12px}
h2{font-size:17px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.mut{color:var(--mut)}.small{font-size:13px}
.strip{display:flex;gap:6px;margin-bottom:12px}
.strip button{flex:1;padding:8px 0;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-size:11px;font-weight:600}
.strip button.on{background:var(--acc);color:#04210f;border-color:var(--acc)}
.strip button.rest{opacity:.6}
.row{display:flex;align-items:center;gap:8px}
.sp{flex:1}
.btn{display:block;width:100%;padding:15px;border-radius:14px;border:0;background:var(--acc);color:#04210f;font-size:17px;font-weight:700}
.btn.sec{background:var(--card2);color:var(--txt);font-weight:600}
.btn.sm{width:auto;display:inline-block;padding:9px 14px;font-size:14px;border-radius:10px}
.btn.danger{background:#3a1d1d;color:var(--bad)}
.link{background:none;border:0;color:var(--mut);text-decoration:underline;font-size:14px;padding:8px}
.ex-title{font-size:18px;font-weight:700}
.tag{display:inline-block;font-size:12px;color:var(--mut);background:var(--card2);border-radius:8px;padding:2px 8px;margin-top:4px}
.wrow{display:flex;align-items:center;gap:8px;margin:12px 0}
.wrow .lbl,.set .lbl{color:var(--mut);font-size:12px;width:48px;flex:none}
.step{width:44px;height:44px;flex:none;border-radius:12px;border:0;background:var(--card2);color:var(--txt);font-size:22px;font-weight:600}
.step:active{background:var(--line)}
.chk{width:44px;height:44px;flex:none;border-radius:12px;border:2px solid var(--line);background:none;color:var(--mut);font-size:20px;font-weight:800}
.chk.on{background:var(--acc);border-color:var(--acc);color:#04210f}
.winp{flex:1;min-width:0;text-align:center;font-size:22px;font-weight:700;background:var(--bg);border:1px solid var(--line);border-radius:12px;color:var(--txt);height:44px}
.sets{display:grid;gap:8px}
.set{display:flex;align-items:center;gap:6px}
.set .val{flex:1;text-align:center;font-size:24px;font-weight:700;border-radius:12px;height:44px;line-height:42px;background:var(--bg);border:1px solid var(--line)}
.set .val.hit{border-color:var(--acc2);color:var(--acc)}
.set .val.miss{border-color:var(--warn);color:var(--warn)}
.foot{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--mut);display:grid;gap:3px}
.up{color:var(--acc)}.down{color:var(--bad)}.flat{color:var(--mut)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-size:14px;font-weight:600}
.chip.on{background:var(--acc);color:#04210f;border-color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{color:var(--mut);font-weight:500;text-align:left;font-size:12px;padding:4px 4px}
td{padding:8px 4px;border-top:1px solid var(--line)}
td.r,th.r{text-align:right}
.sess{padding:12px 0;border-top:1px solid var(--line)}
.sess:first-child{border-top:0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.f label{display:block;font-size:11px;color:var(--mut);margin-bottom:3px}
.f input,.f select,.nm,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:10px;font-size:16px;font-family:inherit}
.nm{margin-bottom:8px;font-weight:600}
textarea{height:90px;font-size:12px}
.exrow{padding:12px 0;border-top:1px solid var(--line)}
.exrow:first-of-type{border-top:0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.modal .sheet{background:var(--card);border-radius:20px 20px 0 0;padding:20px 16px calc(env(safe-area-inset-bottom) + 16px);width:100%;max-width:640px;max-height:85%;overflow-y:auto}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#333a47;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:20}
#timer{position:relative;background:#14301f;border-top:1px solid #1f5a34;overflow:hidden;flex:none}
#timer[hidden]{display:none}
#timer.end{background:#166534}
#tbar{position:absolute;left:0;top:0;bottom:0;background:#1d4d30;width:0;transition:width .25s linear}
.trow{position:relative;display:flex;align-items:center;gap:8px;padding:10px 14px;max-width:640px;margin:0 auto}
#ttime{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;min-width:82px}
#tlabel{flex:1;font-size:13px;color:#b7e4c7;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.trow button{border:0;border-radius:10px;background:#0d2617;color:var(--txt);padding:10px 12px;font-size:14px;font-weight:600}
svg text{fill:var(--mut);font-size:10px}
</style>
</head>
<body>
<div id="app">
  <main id="main"></main>
  <div id="timer" hidden><div id="tbar"></div><div class="trow"><span id="ttime">0:00</span><span id="tlabel"></span><button data-act="tadd" data-n="-15">−15</button><button data-act="tadd" data-n="15">+15</button><button data-act="tstop">✕</button></div></div>
  <nav>
    <button data-tab="today"><span class="ic">🏋️</span>Training</button>
    <button data-tab="progress"><span class="ic">📈</span>Fortschritt</button>
    <button data-tab="plan"><span class="ic">⚙️</span>Plan</button>
  </nav>
</div>
<script>
'use strict';
/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (Math.round(n * 100) / 100).toString().replace('.', ',');
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : NaN; };
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const round025 = n => Math.round(n * 4) / 4;
const dateStr = t => new Date(t).toLocaleDateString('de-DE', {day: '2-digit', month: '2-digit', year: '2-digit'});
const shortDate = t => { const d = new Date(t); return d.getDate() + '.' + (d.getMonth() + 1) + '.'; };

/* ---------- Konstanten ---------- */
const CYCLE = ['push', 'pull', 'legs', 'rest', 'upper', 'lower', 'rest'];
const LABEL = {push: 'Push', pull: 'Pull', legs: 'Beine', upper: 'Oberkörper', lower: 'Unterkörper', rest: 'Pause'};
const SHORT = {push: 'Push', pull: 'Pull', legs: 'Legs', upper: 'Ober', lower: 'Unter', rest: 'Pause'};
const TYPES = ['push', 'pull', 'legs', 'upper', 'lower'];
const MODES = {w: 'Gewicht', bw: 'Körpergewicht + Zusatz', r: 'Nur Wiederholungen'};
const KEY = 'gym.tracker.v2';

// mode: w = Hantel/Gerät, bw = Körpergewicht (+ Zusatzgewicht), r = nur Wiederholungen
const X = (id, name, sets, min, max, weight, rest = 90, mode = 'w', inc = 2.5) => ({id, name, sets, min, max, weight, inc, rest, mode});
function defaultPlan() {
  return {
    push: [X('push_bench', 'Bankdrücken', 4, 5, 8, 60, 150), X('push_ohp', 'Kurzhantel-Schulterdrücken', 3, 8, 12, 15), X('push_incl', 'Kurzhantel-Schrägbankdrücken', 3, 8, 12, 20), X('push_lat', 'Seitheben', 3, 12, 15, 7.5), X('push_tri', 'Kurzhantel-Trizeps-Extensions', 3, 10, 15, 15)],
    pull: [X('pull_chin', 'Klimmzüge', 4, 6, 10, 0, 150, 'bw'), X('pull_row', 'Langhantel-Rudern', 3, 6, 10, 50, 120), X('pull_rfly', 'Reverse Fly', 3, 12, 15, 7.5), X('pull_curl', 'Kurzhantel-Curls', 3, 8, 12, 12.5), X('pull_ham', 'Hammer Curls', 2, 10, 15, 12.5)],
    legs: [X('legs_squat', 'Kniebeugen', 4, 5, 8, 80, 150), X('legs_rdl', 'Rumänisches Kreuzheben', 3, 6, 10, 70, 120), X('legs_bss', 'Bulgarian Split Squats', 3, 8, 12, 15, 120), X('legs_calf', 'Wadenheben', 4, 10, 15, 40), X('legs_hlr', 'Hanging Leg Raises', 3, 8, 15, 0, 60, 'r')],
    upper: [X('up_bench', 'Bankdrücken', 3, 8, 10, 55, 120), X('up_chin', 'Klimmzüge', 3, 6, 10, 0, 120, 'bw'), X('up_row', 'Kurzhantel-Rudern', 3, 8, 12, 25), X('up_curl', 'Kurzhantel-Curls', 3, 8, 12, 12.5), X('up_tri', 'Kurzhantel-Trizeps-Extensions', 3, 10, 15, 15)],
    lower: [X('low_squat', 'Kniebeugen', 3, 8, 10, 70, 120), X('low_bss', 'Bulgarian Split Squats', 3, 8, 12, 15, 120), X('low_rdl', 'Rumänisches Kreuzheben', 3, 8, 10, 70, 120), X('low_calf', 'Wadenheben', 4, 10, 15, 40), X('low_hlr', 'Hanging Leg Raises', 3, 8, 15, 0, 60, 'r')]
  };
}

/* ---------- State ---------- */
let S;
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const d = JSON.parse(raw);
      if (d && d.plan && Array.isArray(d.sessions) && Number.isInteger(d.pos)) {
        d.settings = Object.assign({bw: 80}, d.settings);
        return d;
      }
    }
  } catch (e) {}
  return {plan: defaultPlan(), pos: 0, sessions: [], draft: null, settings: {bw: 80}};
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('⚠️ Speichern fehlgeschlagen!'); }
}
S = load();
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

const ui = {tab: 'today', progType: 'push', progEx: null, openSession: null, modal: null};

/* ---------- Domain ---------- */
// Wiederholungen, die zählen: im laufenden Training nur abgehakte Sätze
const effReps = e => e.done ? e.reps.map((r, i) => e.done[i] ? r : 0) : e.reps;
const load1 = e => e.mode === 'r' ? 1 : e.mode === 'bw' ? (e.bw || 0) + e.weight : e.weight;
const entryVol = e => effReps(e).reduce((a, r) => a + r * load1(e), 0);
const unit = e => e.mode === 'r' ? 'Wdh.' : 'kg';
const sessVol = s => s.entries.filter(e => e.mode !== 'r').reduce((a, e) => a + entryVol(e), 0);
const hitAll = e => { const r = effReps(e); return r.length > 0 && r.every(x => x >= e.max); };
const wLabel = e => e.mode === 'r' ? 'Körpergewicht' : e.mode === 'bw' ? (e.weight ? 'KG + ' + fmt(e.weight) + ' kg' : 'Körpergewicht') : fmt(e.weight) + ' kg';
const lastSession = type => { for (let i = S.sessions.length - 1; i >= 0; i--) if (S.sessions[i].type === type) return S.sessions[i]; return null; };
const lastEntry = exId => {
  for (let i = S.sessions.length - 1; i >= 0; i--) {
    const e = S.sessions[i].entries.find(x => x.exId === exId);
    if (e) return e;
  }
  return null;
};
function delta(cur, prev, u = 'kg') {
  if (prev === null || prev === undefined || prev === 0) return '<span class="flat">erstes Mal</span>';
  const d = cur - prev, p = d / prev * 100;
  const cls = d > 0.001 ? 'up' : d < -0.001 ? 'down' : 'flat';
  const arrow = d > 0.001 ? '▲' : d < -0.001 ? '▼' : '＝';
  return `<span class="${cls}">${arrow} ${d > 0 ? '+' : ''}${fmt(d)} ${u} (${p > 0 ? '+' : ''}${fmt(p)} %)</span>`;
}
function ensureDraft(type) {
  if (!S.draft || S.draft.type !== type) {
    S.draft = {
      type, start: Date.now(),
      entries: S.plan[type].map(p => {
        const pe = lastEntry(p.id);
        // Gleiches Gewicht wie letztes Mal: Wiederholungen von damals vorschlagen, sonst von der unteren Grenze starten
        const same = pe && pe.mode === p.mode && pe.weight === p.weight;
        const reps = Array.from({length: p.sets}, (_, i) => same && pe.reps[i] ? Math.min(99, Math.max(pe.reps[i], p.min)) : p.min);
        return {exId: p.id, name: p.name, min: p.min, max: p.max, inc: p.inc, rest: p.rest, mode: p.mode, bw: S.settings.bw, planSets: p.sets, weight: p.weight, reps, done: reps.map(() => false)};
      })
    };
    save();
  }
  return S.draft;
}

/* ---------- Render ---------- */
function render() {
  const main = $('#main'), y = main.scrollTop;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === ui.tab));
  main.innerHTML = ui.tab === 'today' ? viewToday() : ui.tab === 'progress' ? viewProgress() : viewPlan();
  main.scrollTop = y;
  const old = document.querySelector('.modal'); if (old) old.remove();
  if (ui.modal) document.body.insertAdjacentHTML('beforeend', ui.modal);
}

function viewToday() {
  const type = CYCLE[S.pos];
  const strip = CYCLE.map((t, i) => `<button data-act="setpos" data-i="${i}" class="${i === S.pos ? 'on' : ''} ${t === 'rest' ? 'rest' : ''}">${SHORT[t]}</button>`).join('');
  let h = `<h1>${type === 'rest' ? 'Pausetag 😴' : LABEL[type]}</h1><div class="strip">${strip}</div>`;
  if (type === 'rest') {
    return h + `<div class="card"><p>Heute ist Pause. Erholung gehört zum Training.</p><button class="btn" data-act="restdone">Pause erledigt → nächster Tag</button></div>
      <p class="mut small">Tipp: Oben auf einen anderen Tag tippen, um die Reihenfolge anzupassen.</p>`;
  }
  const d = ensureDraft(type), prev = lastSession(type);
  const cur = sessVol(d);
  h += `<div class="card"><div class="row"><div><div class="mut small">Volumen heute</div><div style="font-size:26px;font-weight:800">${fmt(cur)} kg</div></div><div class="sp"></div><div style="text-align:right" class="small"><div class="mut">vs. letztes ${LABEL[type]}${prev ? ' (' + dateStr(prev.date) + ')' : ''}</div>${!prev ? '<span class="flat">erstes Mal</span>' : d.entries.every(x => x.done.every(Boolean)) ? delta(cur, sessVol(prev)) : `<span class="flat">Ziel: ${fmt(sessVol(prev))} kg</span>`}</div></div></div>`;
  d.entries.forEach((e, i) => {
    const pe = lastEntry(e.exId), v = entryVol(e), u = unit(e), any = e.done.some(Boolean), all = e.done.every(Boolean);
    const sets = e.reps.map((r, s) => `<div class="set"><span class="lbl">Satz ${s + 1}</span><button class="step" data-act="r-" data-i="${i}" data-s="${s}">−</button><div class="val ${r >= e.max ? 'hit' : r < e.min ? 'miss' : ''}">${r}</div><button class="step" data-act="r+" data-i="${i}" data-s="${s}">+</button><button class="chk ${e.done[s] ? 'on' : ''}" data-act="sd" data-i="${i}" data-s="${s}">✓</button></div>`).join('');
    let status;
    if (e.mode === 'r') status = all && hitAll(e) ? `<span class="up">✓ Obergrenze erreicht – nächstes Mal schwerer machen (z. B. Zusatzgewicht)</span>` : `Ziel: alle Sätze × ${e.max} Wdh.`;
    else status = all && hitAll(e) ? `<span class="up">✓ Alle Sätze × ${e.max} → nächstes Mal ${fmt(e.weight + e.inc)} kg</span>` : `Alle Sätze × ${e.max} Wdh. → dann +${fmt(e.inc)} kg`;
    const range = e.min === e.max ? e.max : e.min + '–' + e.max;
    const wrow = e.mode === 'r' ? '' : `<div class="wrow"><span class="lbl">${e.mode === 'bw' ? 'Zusatz' : 'Gewicht'}</span><button class="step" data-act="w-" data-i="${i}">−</button><input class="winp" data-act="winp" data-i="${i}" inputmode="decimal" value="${fmt(e.weight)}"><button class="step" data-act="w+" data-i="${i}">+</button></div>`;
    h += `<div class="card"><div class="ex-title">${esc(e.name)}</div><span class="tag">${e.planSets} × ${range} Wdh. · Pause ${e.rest} s</span>
      ${wrow || '<div style="height:10px"></div>'}
      <div class="sets">${sets}</div>
      <div class="foot">
        <div>${pe ? `Letztes Mal: ${wLabel(pe)} · ${effReps(pe).join('/')} · ${fmt(entryVol(pe))} ${u}` : 'Erstes Mal – noch kein Vergleich'}</div>
        <div>Jetzt: <b style="color:var(--txt)">${any ? fmt(v) + ' ' + u : '–'}</b> ${!pe ? '' : all ? delta(v, entryVol(pe), u) : `<span class="flat">von ${fmt(entryVol(pe))} ${u} letztes Mal</span>`}</div>
        <div>${status}</div>
      </div></div>`;
  });
  h += `<button class="btn" data-act="finish">Training abschließen</button><div style="text-align:center"><button class="link" data-act="skip">Tag überspringen (ohne Speichern)</button></div>`;
  return h;
}

function chart(points, u = 'kg') {
  const pts = points.slice(-12);
  if (!pts.length) return '<p class="mut small">Noch keine Daten.</p>';
  const W = 320, H = 150, pad = 22, bw = Math.min(28, (W - 20) / pts.length - 6);
  const max = Math.max(...pts.map(p => p.value), 1);
  const step = (W - 20) / pts.length;
  const bars = pts.map((p, i) => {
    const bh = Math.max(2, (H - pad - 18) * p.value / max), x = 10 + i * step + (step - bw) / 2, y = H - pad - bh;
    const last = i === pts.length - 1;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="4" fill="${last ? '#4ade80' : '#3b4252'}"/>
      <text x="${x + bw / 2}" y="${y - 4}" text-anchor="middle">${p.value >= 1000 ? fmt(p.value / 1000) + 'k' : fmt(p.value)}</text>
      <text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${esc(p.label)}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${bars}</svg>`;
}

function viewProgress() {
  const type = ui.progType;
  const chips = TYPES.map(t => `<button class="chip ${t === type ? 'on' : ''}" data-act="ptype" data-t="${t}">${LABEL[t]}</button>`).join('');
  const sess = S.sessions.filter(s => s.type === type);
  let h = `<h1>Fortschritt</h1><div class="chips">${chips}</div>`;
  const vols = sess.map(sessVol);
  const last = vols.length - 1;
  h += `<div class="card"><h2>Gesamtvolumen ${LABEL[type]}</h2>${chart(sess.map((s, i) => ({label: shortDate(s.date), value: vols[i]})))}
    ${last >= 0 ? `<div class="small" style="margin-top:8px">Letztes Training: <b>${fmt(vols[last])} kg</b> ${delta(vols[last], last > 0 ? vols[last - 1] : 0)}</div>` : ''}
    <div class="small mut" style="margin-top:4px">Übungen nur mit Wiederholungen (Hanging Leg Raises) zählen nicht zum kg-Volumen.</div></div>`;

  const exs = S.plan[type];
  if (!exs.some(e => e.id === ui.progEx)) ui.progEx = exs[0] ? exs[0].id : null;
  if (exs.length) {
    const ec = exs.map(e => `<button class="chip ${e.id === ui.progEx ? 'on' : ''}" data-act="pex" data-id="${e.id}">${esc(e.name)}</button>`).join('');
    const hist = sess.map(s => ({s, e: s.entries.find(x => x.exId === ui.progEx)})).filter(x => x.e);
    const cur = exs.find(e => e.id === ui.progEx);
    const u = cur ? unit(cur) : 'kg';
    h += `<div class="card"><h2>Übung – Volumen (${u})</h2><div class="chips">${ec}</div>${chart(hist.map(x => ({label: shortDate(x.s.date), value: entryVol(x.e)})))}`;
    if (hist.length) {
      h += `<table style="margin-top:8px"><tr><th>Datum</th><th>Gewicht</th><th>Sätze</th><th class="r">Volumen</th></tr>` +
        hist.slice().reverse().map((x, i, arr) => {
          const prev = arr[i + 1], v = entryVol(x.e);
          const dv = prev ? v - entryVol(prev.e) : null;
          return `<tr><td>${dateStr(x.s.date)}</td><td>${wLabel(x.e)}</td><td>${effReps(x.e).join('/')}</td><td class="r">${fmt(v)}${dv === null ? '' : `<br><span class="small ${dv > 0 ? 'up' : dv < 0 ? 'down' : 'flat'}">${dv > 0 ? '+' : ''}${fmt(dv)}</span>`}</td></tr>`;
        }).join('') + '</table>';
    }
    if (cur) h += `<p class="small mut">Aktuell: ${wLabel(cur)} · Ziel ${cur.sets}×${cur.min === cur.max ? cur.max : cur.min + '–' + cur.max}</p>`;
    h += '</div>';
  }

  h += `<div class="card"><h2>Trainings ${LABEL[type]}</h2>`;
  if (!sess.length) h += '<p class="mut small">Noch keine Trainings gespeichert.</p>';
  sess.slice().reverse().forEach(s => {
    const idx = S.sessions.indexOf(s), open = ui.openSession === s.id;
    const prevS = (() => { for (let i = idx - 1; i >= 0; i--) if (S.sessions[i].type === s.type) return S.sessions[i]; return null; })();
    h += `<div class="sess"><div class="row" data-act="opens" data-id="${s.id}" style="cursor:pointer"><div><b>${dateStr(s.date)}</b><div class="small mut">${fmt(sessVol(s))} kg</div></div><div class="sp"></div><div class="small" style="text-align:right">${delta(sessVol(s), prevS ? sessVol(prevS) : 0)}</div></div>`;
    if (open) {
      h += '<div style="margin-top:8px">' + s.entries.map(e => `<div class="small" style="padding:3px 0">${esc(e.name)}: ${wLabel(e)} · ${effReps(e).join('/')} · <b>${fmt(entryVol(e))} ${unit(e)}</b></div>`).join('') +
        `<button class="btn sm danger" style="margin-top:8px" data-act="dels" data-id="${s.id}">Training löschen</button></div>`;
    }
    h += '</div>';
  });
  return h + '</div>';
}

function viewPlan() {
  let h = `<h1>Plan</h1><p class="mut small">Ablauf: Push → Pull → Beine → Pause → Oberkörper → Unterkörper → Pause → wieder von vorn.<br>Steigerung: Schaffst du in <b>allen Sätzen die obere Wdh.-Grenze</b>, steigt das Gewicht um den Schritt. Vorher bleibt es.</p>
    <div class="card"><h2>Dein Körpergewicht</h2><div class="f"><input inputmode="decimal" data-set="bw" value="${fmt(S.settings.bw)}"></div><p class="small mut" style="margin-bottom:0">Wird für das Volumen bei Klimmzügen (Körpergewicht + Zusatz) gebraucht.</p></div>`;
  TYPES.forEach(t => {
    h += `<div class="card"><h2>${LABEL[t]}</h2>`;
    S.plan[t].forEach((e, i) => {
      const a = (f, v, mode = 'numeric') => `<input inputmode="${mode}" data-plan="${f}" data-t="${t}" data-i="${i}" value="${v}">`;
      h += `<div class="exrow"><input class="nm" data-plan="name" data-t="${t}" data-i="${i}" value="${esc(e.name)}">
        <div class="grid3 f">
          <div><label>Sätze</label>${a('sets', e.sets)}</div>
          <div><label>Wdh. von</label>${a('min', e.min)}</div>
          <div><label>Wdh. bis</label>${a('max', e.max)}</div>
          <div><label>${e.mode === 'bw' ? 'Zusatz kg' : 'Gewicht kg'}</label>${a('weight', fmt(e.weight), 'decimal')}</div>
          <div><label>Schritt kg</label>${a('inc', fmt(e.inc), 'decimal')}</div>
          <div><label>Pause (s)</label>${a('rest', e.rest)}</div>
        </div>
        <div class="f"><label>Art</label><select data-plan="mode" data-t="${t}" data-i="${i}">${Object.keys(MODES).map(m => `<option value="${m}" ${m === e.mode ? 'selected' : ''}>${MODES[m]}</option>`).join('')}</select></div>
        <div class="row" style="margin-top:6px"><button class="link" data-act="pmove" data-t="${t}" data-i="${i}" data-d="-1">↑ hoch</button><button class="link" data-act="pmove" data-t="${t}" data-i="${i}" data-d="1">↓ runter</button><div class="sp"></div><button class="link" data-act="pdel" data-t="${t}" data-i="${i}">Entfernen</button></div></div>`;
    });
    h += `<button class="btn sec sm" data-act="padd" data-t="${t}">+ Übung hinzufügen</button></div>`;
  });
  h += `<div class="card"><h2>Backup</h2><p class="small mut">Alle Daten liegen nur auf diesem iPhone. Kopiere ab und zu ein Backup und speichere es z. B. in Notizen.</p>
    <button class="btn sec sm" data-act="export">Backup kopieren</button>
    <textarea id="imp" placeholder="Backup hier einfügen …" style="margin-top:10px"></textarea>
    <button class="btn sec sm" style="margin-top:8px" data-act="import">Backup wiederherstellen</button></div>`;
  return h;
}

/* ---------- Pausentimer ---------- */
let T = null, actx = null, wake = null;
function unlockAudio() {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {}
}
function beep() {
  try {
    if (!actx) return;
    [0, .25, .5].forEach((t, k) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = k === 2 ? 1175 : 880; o.connect(g); g.connect(actx.destination);
      const st = actx.currentTime + t; g.gain.setValueAtTime(.0001, st); g.gain.exponentialRampToValueAtTime(.4, st + .02); g.gain.exponentialRampToValueAtTime(.0001, st + .2);
      o.start(st); o.stop(st + .22);
    });
  } catch (e) {}
  try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
}
function startTimer(sec, label) { T = {end: Date.now() + sec * 1000, total: sec, label, fired: false}; tickTimer(); }
function tickTimer() {
  const el = $('#timer');
  if (!T) { el.hidden = true; return; }
  el.hidden = false;
  const left = Math.ceil((T.end - Date.now()) / 1000);
  $('#tlabel').textContent = T.label;
  if (left <= 0) {
    if (!T.fired) { T.fired = true; T.doneAt = Date.now(); beep(); }
    if (Date.now() - T.doneAt > 8000) { T = null; el.hidden = true; return; }
    el.classList.add('end'); $('#ttime').textContent = 'Los! 💪'; $('#tbar').style.width = '100%';
  } else {
    el.classList.remove('end');
    $('#ttime').textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
    $('#tbar').style.width = (100 - left / T.total * 100) + '%';
  }
}
setInterval(tickTimer, 250);
async function keepAwake() {
  try { if ('wakeLock' in navigator && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { tickTimer(); if (S.draft && S.draft.entries.some(e => e.done.some(Boolean))) keepAwake(); } });

/* ---------- Aktionen ---------- */
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}
function finish() {
  const d = S.draft; if (!d) return;
  const open = d.entries.reduce((a, e) => a + e.done.filter(x => !x).length, 0);
  if (d.entries.every(e => e.done.every(x => !x))) { toast('Noch kein Satz abgehakt'); return; }
  if (!confirm(open ? `${open} Satz/Sätze nicht abgehakt – sie zählen als nicht gemacht. Trotzdem speichern?` : 'Training abschließen und speichern?')) return;
  const session = {id: uid(), date: Date.now(), type: d.type, entries: d.entries.map(e => { const c = {...e, reps: effReps(e).slice()}; delete c.done; return c; })};
  const prev = lastSession(d.type);
  let lines = '';
  session.entries.forEach(e => {
    const pe = lastEntry(e.exId), hit = hitAll(e), px = S.plan[d.type].find(p => p.id === e.exId);
    let msg, cls = 'mut';
    if (e.mode === 'r') { msg = hit ? '🎉 Obergrenze erreicht – nächstes Mal schwerer machen' : '➡ Weiter bis ' + e.max + ' Wdh. in allen Sätzen'; cls = hit ? 'up' : 'mut'; }
    else {
      const next = hit ? round025(e.weight + e.inc) : e.weight;
      if (px) px.weight = next;
      const add = e.mode === 'bw' ? 'Zusatz ' : '';
      msg = hit ? `⬆ Nächstes Mal ${add}${fmt(next)} kg` : `➡ Bleibt bei ${add}${fmt(next)} kg (Ziel: alle Sätze × ${e.max})`; cls = hit ? 'up' : 'mut';
    }
    lines += `<div style="padding:8px 0;border-top:1px solid var(--line)"><b>${esc(e.name)}</b> <span class="small mut">${e.reps.join('/')} @ ${wLabel(e)}</span><div class="small">${pe ? delta(entryVol(e), entryVol(pe), unit(e)) : 'erstes Mal'}</div><div class="small ${cls}">${msg}</div></div>`;
  });
  S.sessions.push(session);
  S.pos = (S.pos + 1) % CYCLE.length;
  S.draft = null; T = null; tickTimer();
  try { wake && wake.release(); } catch (e) {}
  save();
  ui.modal = `<div class="modal"><div class="sheet"><h2>Training gespeichert ✅</h2>
    <div class="card"><div class="mut small">Gesamtvolumen ${LABEL[session.type]}</div><div style="font-size:24px;font-weight:800">${fmt(sessVol(session))} kg</div><div class="small">${delta(sessVol(session), prev ? sessVol(prev) : 0)}</div></div>
    ${lines}<button class="btn" style="margin-top:14px" data-act="closemodal">Weiter</button></div></div>`;
  render();
}
const invalidateDraft = t => { if (S.draft && S.draft.type === t && !S.draft.entries.some(e => e.done.some(Boolean))) S.draft = null; };

document.addEventListener('click', ev => {
  const nav = ev.target.closest('nav button');
  if (nav) { ui.tab = nav.dataset.tab; render(); $('#main').scrollTop = 0; return; }
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, i = +b.dataset.i, s = +b.dataset.s, d = S.draft;
  switch (act) {
    case 'setpos': if (S.pos !== i) { if (d && d.entries.some(e => e.done.some(Boolean)) && !confirm('Angefangenes Training verwerfen?')) return; S.pos = i; S.draft = null; save(); } break;
    case 'restdone': S.pos = (S.pos + 1) % CYCLE.length; save(); break;
    case 'skip': if (!confirm('Diesen Tag überspringen? Eingaben gehen verloren.')) return; S.pos = (S.pos + 1) % CYCLE.length; S.draft = null; save(); break;
    case 'w-': d.entries[i].weight = Math.max(0, round025(d.entries[i].weight - d.entries[i].inc)); save(); break;
    case 'w+': d.entries[i].weight = round025(d.entries[i].weight + d.entries[i].inc); save(); break;
    case 'r-': d.entries[i].reps[s] = Math.max(0, d.entries[i].reps[s] - 1); save(); break;
    case 'r+': d.entries[i].reps[s] = Math.min(99, d.entries[i].reps[s] + 1); save(); break;
    case 'sd': {
      const e = d.entries[i]; e.done[s] = !e.done[s]; save();
      if (e.done[s]) {
        unlockAudio(); keepAwake();
        if (!d.entries.every(x => x.done.every(Boolean))) startTimer(e.rest, e.name + ' · Satz ' + (s + 1) + ' fertig');
      }
      break;
    }
    case 'tadd': if (T) { T.end += (+b.dataset.n) * 1000; T.total = Math.max(T.total, Math.ceil((T.end - Date.now()) / 1000)); T.fired = false; tickTimer(); } return;
    case 'tstop': T = null; tickTimer(); return;
    case 'finish': finish(); return;
    case 'closemodal': ui.modal = null; break;
    case 'ptype': ui.progType = b.dataset.t; ui.progEx = null; break;
    case 'pex': ui.progEx = b.dataset.id; break;
    case 'opens': ui.openSession = ui.openSession === b.dataset.id ? null : b.dataset.id; break;
    case 'dels': if (!confirm('Dieses Training endgültig löschen?')) return; S.sessions = S.sessions.filter(x => x.id !== b.dataset.id); ui.openSession = null; save(); break;
    case 'padd': S.plan[b.dataset.t].push(X('x_' + uid(), 'Neue Übung', 3, 8, 12, 20)); invalidateDraft(b.dataset.t); save(); break;
    case 'pdel': if (!confirm('Übung aus dem Plan entfernen? (Bisherige Trainings bleiben gespeichert)')) return; S.plan[b.dataset.t].splice(i, 1); invalidateDraft(b.dataset.t); save(); break;
    case 'pmove': {
      const arr = S.plan[b.dataset.t], j = i + (+b.dataset.d);
      if (j < 0 || j >= arr.length) return;
      [arr[i], arr[j]] = [arr[j], arr[i]]; invalidateDraft(b.dataset.t); save(); break;
    }
    case 'export': {
      const txt = JSON.stringify(S);
      (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('Backup kopiert ✓'), () => { const ta = $('#imp'); ta.value = txt; ta.select(); toast('Text markiert – bitte manuell kopieren'); });
      return;
    }
    case 'import': {
      try {
        const d2 = JSON.parse($('#imp').value);
        if (!d2 || !d2.plan || !Array.isArray(d2.sessions)) throw 0;
        if (!confirm('Aktuelle Daten durch das Backup ersetzen?')) return;
        S = {plan: d2.plan, pos: Number.isInteger(d2.pos) ? d2.pos : 0, sessions: d2.sessions, draft: null, settings: Object.assign({bw: 80}, d2.settings)}; save(); toast('Wiederhergestellt ✓');
      } catch (e) { toast('Ungültiges Backup'); return; }
      break;
    }
    default: return;
  }
  render();
});

document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.act === 'winp') {
    const v = num(t.value);
    if (isFinite(v) && v >= 0) { S.draft.entries[+t.dataset.i].weight = round025(v); save(); }
    render(); return;
  }
  if (t.dataset.set === 'bw') {
    const v = num(t.value);
    if (isFinite(v) && v > 0) { S.settings.bw = v; invalidateDraft('pull'); invalidateDraft('upper'); save(); }
    render(); return;
  }
  if (t.dataset.plan) {
    const ty = t.dataset.t, ex = S.plan[ty][+t.dataset.i], f = t.dataset.plan;
    if (f === 'name') {
      const nn = t.value.trim();
      if (nn && nn !== ex.name) {
        // Andere Übung => eigener Verlauf, damit sich Statistiken nicht vermischen
        if (confirm(`„${nn}" ist eine ANDERE Übung?\n\nOK = neuer, getrennter Verlauf (Startgewicht bitte prüfen)\nAbbrechen = nur Schreibweise korrigieren, Verlauf bleibt`)) ex.id = 'x_' + uid();
        ex.name = nn;
      }
    } else if (f === 'mode') {
      ex.mode = t.value;
      if (ex.mode === 'r') ex.weight = 0;
    } else {
      const v = num(t.value);
      if (isFinite(v) && (v > 0 || (f === 'weight' && v >= 0))) {
        ex[f] = (f === 'sets' || f === 'min' || f === 'max' || f === 'rest') ? Math.round(v) : round025(v);
        if (f === 'min' && ex.min > ex.max) ex.max = ex.min;
        if (f === 'max' && ex.max < ex.min) ex.min = ex.max;
      }
    }
    invalidateDraft(ty); save(); render();
  }
});

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
render();
</script>
</body>
</html>
